name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  science:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: science } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Fetch and verify source products
        working-directory: .
        run: ./scripts/fetch_data.sh
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy moonnav_science
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: moonnav, POSTGRES_PASSWORD: ci, POSTGRES_DB: moonnav_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://moonnav:ci@localhost:5432/moonnav_test
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      SCIENCE_SERVICE_TOKEN: ci-only-service-token-0123456789
      APP_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx tsx scripts/migrate.ts
      - run: npm run build
