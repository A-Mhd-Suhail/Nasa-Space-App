[project]
name = "moonnav-science"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pydantic>=2.14.3",
    "spiceypy>=8.3.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
